<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Herencia en el árbol de elementos</title>
<desc id="d">El elemento main define color verde y un borde; sus hijos p y em heredan el color verde pero no el borde; el enlace a no hereda el color porque el navegador le da el suyo, salvo que se use inherit.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="378" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Herencia: lo que se define en un elemento llega a sus hijos</text>
<rect x="250" y="60" width="400" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="450.0" y="90.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">main</text>
<text x="450.0" y="109.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">color: verde; borde: sólido</text>
<line x1="450" y1="130" x2="160" y2="190" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="190" width="240" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="160.0" y="226.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">p</text>
<text x="160.0" y="244.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">color: verde ✔ (hereda)</text>
<text x="160.0" y="262.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">borde: ninguno ✘ (no se hereda)</text>
<line x1="450" y1="130" x2="450" y2="190" stroke="#64748b" stroke-width="2"/>
<rect x="330" y="190" width="240" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="450.0" y="235.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">em</text>
<text x="450.0" y="253.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">color: verde ✔ (hereda)</text>
<line x1="450" y1="130" x2="740" y2="190" stroke="#64748b" stroke-width="2"/>
<rect x="620" y="190" width="240" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="226.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">a</text>
<text x="740.0" y="244.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">color: azul del navegador</text>
<text x="740.0" y="262.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">no hereda, salvo con inherit</text>
<text x="450" y="335" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">color se hereda; border, background, margin y width no se heredan.</text>
</svg>
