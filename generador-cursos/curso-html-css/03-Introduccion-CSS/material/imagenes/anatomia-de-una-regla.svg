<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomía de una regla CSS</title>
<desc id="d">Una regla CSS tiene un selector, un bloque entre llaves con una o más declaraciones, y cada declaración está formada por una propiedad, dos puntos, un valor y un punto y coma.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="348" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Anatomía de una regla CSS</text>
<rect x="60" y="76" width="300" height="205" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="80" y="117" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#2563eb" xml:space="preserve">h1</text>
<text x="112" y="117" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">{</text>
<text x="100" y="165" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#0d9488" xml:space="preserve">color</text>
<text x="160" y="165" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">:</text>
<text x="178" y="165" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#d97706" xml:space="preserve">red</text>
<text x="214" y="165" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">;</text>
<text x="100" y="213" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#0d9488" xml:space="preserve">opacity</text>
<text x="184" y="213" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">:</text>
<text x="202" y="213" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#d97706" xml:space="preserve">0.9</text>
<text x="238" y="213" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">;</text>
<text x="80" y="261" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#1f2937" xml:space="preserve">}</text>
<rect x="450" y="90" width="400" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="650.0" y="107.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Selector</text>
<text x="650.0" y="124.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">dice a qué elementos se aplica la regla</text>
<line x1="448" y1="112" x2="150" y2="112" stroke="#64748b" stroke-width="2"/>
<rect x="450" y="138" width="400" height="44" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="650.0" y="155.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Declaración 1</text>
<text x="650.0" y="172.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">propiedad color, valor red</text>
<line x1="448" y1="160" x2="236" y2="160" stroke="#64748b" stroke-width="2"/>
<rect x="450" y="186" width="400" height="44" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="650.0" y="203.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Declaración 2</text>
<text x="650.0" y="220.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">propiedad opacity, valor 0.9</text>
<line x1="448" y1="208" x2="262" y2="208" stroke="#64748b" stroke-width="2"/>
<rect x="450" y="234" width="400" height="44" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="650.0" y="251.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Bloque de declaraciones</text>
<text x="650.0" y="268.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">todo lo que va entre las llaves</text>
<line x1="448" y1="256" x2="100" y2="256" stroke="#64748b" stroke-width="2"/>
<text x="450" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Cada declaración termina en punto y coma. Los comentarios se escriben entre /* y */.</text>
</svg>
