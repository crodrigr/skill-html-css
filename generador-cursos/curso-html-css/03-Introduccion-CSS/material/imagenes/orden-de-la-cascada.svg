<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Orden de la cascada</title>
<desc id="d">La cascada decide qué declaración se aplica comparando primero el origen y la importancia, luego la especificidad (identificador vale 100, clase 10, elemento 1) y por último el orden de aparición, donde gana la última.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="438" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La cascada: tres criterios, en este orden</text>
<rect x="40" y="64" width="250" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="165.0" y="104.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1. Origen e importancia</text>
<text x="165.0" y="122.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">¿de dónde viene? ¿lleva !important?</text>
<rect x="325" y="64" width="250" height="90" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="450.0" y="104.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2. Especificidad</text>
<text x="450.0" y="122.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">ID 100 · clase 10 · elemento 1</text>
<rect x="610" y="64" width="250" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="735.0" y="104.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">3. Orden de aparición</text>
<text x="735.0" y="122.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">con el mismo peso, gana la última</text>
<path d="M292 109 H323" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M577 109 H608" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="450" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Origen: de menor a mayor precedencia</text>
<rect x="40" y="286" width="195" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="137.5" y="316.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Navegador</text>
<text x="137.5" y="334.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">estilos por defecto</text>
<path d="M237 321 L253 299" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="255" y="264" width="195" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="352.5" y="294.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Usuario</text>
<text x="352.5" y="312.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">preferencias de quien lee</text>
<path d="M452 299 L468 277" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="470" y="242" width="195" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="567.5" y="272.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Autor</text>
<text x="567.5" y="290.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">tu hoja de estilos</text>
<path d="M667 277 L683 255" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="685" y="220" width="195" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="782.5" y="250.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Autor + !important</text>
<text x="782.5" y="268.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">anula todo lo anterior</text>
<text x="450" y="395" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">!important solo se usa si no hay otra salida: invierte la precedencia habitual.</text>
</svg>
