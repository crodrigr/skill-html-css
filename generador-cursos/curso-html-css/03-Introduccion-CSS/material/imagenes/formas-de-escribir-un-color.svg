<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Formas de escribir un color</title>
<desc id="d">El mismo azul principal se escribe en hexadecimal 2563eb, en rgb con 37, 99 y 235 y en hsl con 221 grados, 83 por ciento y 53 por ciento; con un canal alfa de 0,5 se escribe rgb con barra 0,5 o hexadecimal con 80 al final.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="358" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">El mismo azul, escrito de distintas formas</text>
<rect x="40" y="64" width="240" height="70" rx="10" fill="#2563eb" fill-opacity="1.0" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="144" width="240" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="160.0" y="169.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Hexadecimal</text>
<text x="160.0" y="187.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">#2563eb</text>
<rect x="330" y="64" width="240" height="70" rx="10" fill="#2563eb" fill-opacity="1.0" stroke="#cbd5e1" stroke-width="2"/>
<rect x="330" y="144" width="240" height="60" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="450.0" y="169.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">RGB</text>
<text x="450.0" y="187.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">rgb(37, 99, 235)</text>
<rect x="620" y="64" width="240" height="70" rx="10" fill="#2563eb" fill-opacity="1.0" stroke="#cbd5e1" stroke-width="2"/>
<rect x="620" y="144" width="240" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="740.0" y="169.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">HSL</text>
<text x="740.0" y="187.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">hsl(221, 83%, 53%)</text>
<text x="450" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Con transparencia (canal alfa de 0,5): se ve el fondo a través del color</text>
<rect x="40" y="250" width="190" height="64" rx="10" fill="#fde68a"/><rect x="230" y="250" width="190" height="64" fill="#ffffff"/>
<rect x="40" y="250" width="380" height="64" rx="10" fill="#2563eb" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="2"/>
<text x="230" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rgb(37 99 235 / 0.5)</text>
<rect x="480" y="250" width="190" height="64" rx="10" fill="#fde68a"/><rect x="670" y="250" width="190" height="64" fill="#ffffff"/>
<rect x="480" y="250" width="380" height="64" rx="10" fill="#2563eb" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="2"/>
<text x="670" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">#2563eb80</text>
<text x="450" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">El HSL redondeado es casi el mismo color: Chrome lo calcula como rgb(36, 99, 235).</text>
</svg>
