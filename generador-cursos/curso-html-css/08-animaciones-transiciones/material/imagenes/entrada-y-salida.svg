<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Transición de entrada y de salida</title>
<desc id="d">Dos tiras de color a la misma escala de tiempo. Al entrar con el cursor, la regla de hover manda: 0.2 segundos con ease-out, y el botón pasa de azul a gris oscuro rápido. Al salir, manda la regla del estado base: 1 segundo con ease-in, y vuelve de gris oscuro a azul lentamente.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La transición del estado de destino es la que manda</text>
<text x="20" y="106" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">ENTRADA</text>
<text x="20" y="126" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">el cursor entra</text>
<defs><linearGradient id="gENTRADA" x1="0" x2="1"><stop offset="0" stop-color="rgb(37,99,235)"/><stop offset="1" stop-color="rgb(17,24,39)"/></linearGradient></defs>
