<text x="904" y="116" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve"></text>
<text x="150" y="238" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">:hover { transition: 0.2s ease-out }</text>
<text x="20" y="276" text-anchor="start" font-size="16" font-weight="700" fill="#dc2626">SALIDA</text>
<text x="20" y="296" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">el cursor sale</text>
