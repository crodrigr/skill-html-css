<text x="225.0" y="116" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#ffffff" xml:space="preserve">200 ms</text>
<line x1="150" y1="164" x2="900" y2="164" stroke="#1f2937" stroke-width="1.5"/>
