<text x="150" y="408" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">estado base { transition: 1s ease-in }</text>
<text x="480" y="454" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Medido con el cursor entrando y saliendo: la salida (1000 ms) dura cinco veces más que la entrada (200 ms).</text>
