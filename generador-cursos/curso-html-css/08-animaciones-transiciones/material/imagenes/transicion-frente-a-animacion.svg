<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Transición frente a animación</title>
<desc id="d">Comparación en dos columnas. La transición va de un estado a otro cuando cambia un valor, por ejemplo al pasar el cursor, con un solo tramo y se define con la propiedad transition. La animación se reproduce sola o cuando se la asocia a un elemento, puede tener muchos pasos, repetirse y alternar, y se define con la regla keyframes y la propiedad animation.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="498" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dos formas de mover: ¿cuándo usar cada una?</text>
<rect x="40" y="60" width="420" height="40" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="85.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">TRANSICIÓN</text>
<rect x="500" y="60" width="420" height="40" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="710.0" y="85.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">ANIMACIÓN</text>
<line x1="70" y1="170" x2="410" y2="170" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="70.0" cy="170.0" r="8" fill="#2563eb"/>
<circle cx="410.0" cy="170.0" r="8" fill="#2563eb"/>
<text x="70" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">estado A</text>
<text x="410" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">estado B</text>
<path d="M90 170 L388 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="240" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">un solo tramo</text>
<line x1="530" y1="170" x2="890" y2="170" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="530.0" cy="170.0" r="7" fill="#16a34a"/>
<text x="530" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">0%</text>
<circle cx="620.0" cy="170.0" r="7" fill="#16a34a"/>
<text x="620" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">25%</text>
<circle cx="710.0" cy="170.0" r="7" fill="#16a34a"/>
<text x="710" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">50%</text>
<circle cx="800.0" cy="170.0" r="7" fill="#16a34a"/>
<text x="800" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">75%</text>
<circle cx="890.0" cy="170.0" r="7" fill="#16a34a"/>
<text x="890" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">100%</text>
<path d="M890 186 C 930 215, 500 215, 530 186" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="710" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">varios pasos; puede repetirse y alternar</text>
<text x="30" y="280" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">La dispara</text>
<rect x="150" y="262" width="330" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="315" y="285" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">un cambio de valor (:hover, :focus, una clase)</text>
<rect x="500" y="262" width="420" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="710" y="285" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">sola, al cargar o al asociarla a un elemento</text>
<text x="30" y="324" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">Pasos</text>
<rect x="150" y="306" width="330" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="315" y="329" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">dos: el inicial y el final</text>
<rect x="500" y="306" width="420" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="710" y="329" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">los que quieras (from, to, porcentajes)</text>
<text x="30" y="368" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">Repetición</text>
<rect x="150" y="350" width="330" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="315" y="373" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">no se repite sola</text>
<rect x="500" y="350" width="420" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="710" y="373" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">repeticiones, infinite, alternate</text>
<text x="30" y="412" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">Se escribe con</text>
<rect x="150" y="394" width="330" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="315" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">transition</text>
<rect x="500" y="394" width="420" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="710" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">@keyframes + animation</text>
<text x="30" y="456" text-anchor="start" font-size="12" font-weight="700" fill="#64748b">Conviene para</text>
<rect x="150" y="438" width="330" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="315" y="461" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">suavizar un cambio de estado</text>
<rect x="500" y="438" width="420" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="710" y="461" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">avisos, cargas, entradas, secuencias</text>
</svg>
