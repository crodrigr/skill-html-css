<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La línea de tiempo de una transición</title>
<desc id="d">Una transición con un retardo de 1 segundo y una duración de 0.5 segundos. Entre 0 y 1000 milisegundos el botón sigue azul (retardo); entre 1000 y 1500 milisegundos el color cambia gradualmente; desde 1500 milisegundos queda en gris oscuro. Se muestran los colores medidos en 0, 1000, 1250 y 1500 milisegundos.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="428" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La línea de tiempo de una transición</text>
<rect x="90.0" y="100" width="458.82352941176464" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="319.4117647058823" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">retardo (transition-delay: 1s)</text>
<text x="319.4117647058823" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">todavía no pasa nada</text>
<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="rgb(37,99,235)"/><stop offset="1" stop-color="rgb(17,24,39)"/></linearGradient></defs>
<rect x="548.8235294117646" y="100" width="229.41176470588243" height="56" rx="6" fill="url(#g1)" stroke="#2563eb" stroke-width="2"/>
<text x="663.5294117647059" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">duración</text>
<text x="663.5294117647059" y="144" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">0.5s</text>
<rect x="778.2352941176471" y="100" width="91.76470588235293" height="56" rx="6" fill="rgb(17,24,39)" stroke="#111827" stroke-width="2"/>
<text x="824.1176470588235" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">estado</text>
<text x="824.1176470588235" y="144" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">final</text>
<line x1="90" y1="200" x2="870" y2="200" stroke="#1f2937" stroke-width="2"/>
<line x1="90.0" y1="192" x2="90.0" y2="208" stroke="#1f2937" stroke-width="2"/>
<text x="90.0" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">0 ms</text>
<rect x="62.0" y="246" width="56" height="36" rx="6" fill="rgb(37,99,235)" stroke="#64748b" stroke-width="1.5"/>
<text x="90.0" y="304" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2937" xml:space="preserve">rgb(37,99,235)</text>
<line x1="548.8235294117646" y1="192" x2="548.8235294117646" y2="208" stroke="#1f2937" stroke-width="2"/>
<text x="548.8235294117646" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1000 ms</text>
<rect x="520.8235294117646" y="246" width="56" height="36" rx="6" fill="rgb(37,99,235)" stroke="#64748b" stroke-width="1.5"/>
<text x="548.8235294117646" y="304" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2937" xml:space="preserve">rgb(37,99,235)</text>
<line x1="663.5294117647059" y1="192" x2="663.5294117647059" y2="208" stroke="#1f2937" stroke-width="2"/>
<text x="663.5294117647059" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1250 ms</text>
<rect x="635.5294117647059" y="246" width="56" height="36" rx="6" fill="rgb(21,39,78)" stroke="#64748b" stroke-width="1.5"/>
<text x="663.5294117647059" y="304" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2937" xml:space="preserve">rgb(21,39,78)</text>
<line x1="778.2352941176471" y1="192" x2="778.2352941176471" y2="208" stroke="#1f2937" stroke-width="2"/>
<text x="778.2352941176471" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1500 ms</text>
<rect x="750.2352941176471" y="246" width="56" height="36" rx="6" fill="rgb(17,24,39)" stroke="#64748b" stroke-width="1.5"/>
<text x="778.2352941176471" y="304" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2937" xml:space="preserve">rgb(17,24,39)</text>
<text x="90.0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">el cursor entra</text>
<path d="M90.0 84 L90.0 98" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="548.8235294117646" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">empieza el cambio</text>
<path d="M548.8235294117646 84 L548.8235294117646 98" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="778.2352941176471" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">termina</text>
<path d="M778.2352941176471 84 L778.2352941176471 98" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="90" y="340" width="780" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="108" y="364" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">.boton { transition: background-color 0.5s ease 1s; }</text>
<text x="108" y="388" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">En 1250 ms (la mitad de la duración) el color ya avanzó el 80%: la función de tiempo por defecto es ease.</text>
</svg>
