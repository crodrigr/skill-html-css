<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">@keyframes: from y to, y selectores porcentuales</title>
<desc id="d">Arriba, una secuencia con dos pasos: from, que equivale a 0 por ciento, con opacidad 0 y desplazada 20 píxeles hacia abajo, y to, que equivale a 100 por ciento, con opacidad 1 y sin desplazamiento. Abajo, un rebote con cinco pasos en 2 segundos: 0 por ciento en 0 píxeles, 25 por ciento en menos 60, 50 por ciento en 0, 75 por ciento en menos 30 y 100 por ciento en 0; los pasos caen a 0, 0.5, 1, 1.5 y 2 segundos.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Los pasos de una animación</text>
<text x="30" y="84" text-anchor="start" font-size="15" font-weight="700" fill="#2563eb">from y to</text>
<line x1="110" y1="150" x2="850" y2="150" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="110.0" cy="150.0" r="8" fill="#2563eb"/>
<text x="110" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">from  (0%)</text>
<text x="190" y="178" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">opacity: 0; translateY(20px)</text>
<circle cx="850.0" cy="150.0" r="8" fill="#2563eb"/>
<text x="850" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">to  (100%)</text>
<text x="770" y="178" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">opacity: 1; translateY(0)</text>
<text x="480.0" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">animation-duration: 1s</text>
<path d="M130 150 L830 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="30" y="252" text-anchor="start" font-size="15" font-weight="700" fill="#16a34a">Porcentajes (2s)</text>
