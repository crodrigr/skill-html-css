<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Las funciones de tiempo predefinidas</title>
<desc id="d">Cinco gráficas del progreso del cambio a lo largo del tiempo: linear es una recta; ease arranca con rapidez y termina despacio; ease-in arranca despacio y termina rápido; ease-out arranca rápido y termina despacio; ease-in-out arranca y termina despacio. Debajo de cada gráfica, los cuatro valores de su cubic-bezier.</desc>
