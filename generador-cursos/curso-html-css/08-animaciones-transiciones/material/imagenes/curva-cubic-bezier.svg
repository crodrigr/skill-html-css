<text x="300.0" y="488" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">tiempo (0 a 1)</text>
<text x="80" y="270.0" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 80 270.0)">progreso del cambio</text>
<path d="M90.0 360.9 L93.5 362.1 L97.0 363.3 L100.5 364.4 L104.0 365.5 L107.5 366.6 L111.0 367.6 L114.5 368.6 L118.0 369.6 L121.5 370.5 L125.0 371.4 L128.5 372.2 L132.0 373.0 L135.5 373.7 L139.0 374.4 L142.5 375.0 L146.0 375.5 L149.5 376.1 L153.0 376.5 L156.5 376.9 L160.0 377.2 L163.5 377.5 L167.0 377.6 L170.5 377.7 L174.0 377.8 L177.5 377.7 L181.0 377.6 L184.5 377.3 L188.0 377.0 L191.5 376.5 L195.0 376.0 L198.5 375.3 L202.0 374.5 L205.5 373.6 L209.0 372.5 L212.5 371.3 L216.0 370.0 L219.5 368.4 L223.0 366.7 L226.5 364.8 L230.0 362.6 L233.5 360.3 L237.0 357.7 L240.5 354.8 L244.0 351.6 L247.5 348.1 L251.0 344.3 L254.5 340.1 L258.0 335.6 L261.5 330.6 L265.0 325.2 L268.5 319.3 L272.0 313.0 L275.5 306.3 L279.0 299.2 L282.5 291.7 L286.0 283.9 L289.5 276.0 L293.0 268.0 L296.5 260.1 L300.0 252.4 L303.5 245.0 L307.0 238.0 L310.5 231.3 L314.0 225.1 L317.5 219.3 L321.0 214.0 L324.5 209.0 L328.0 204.4 L331.5 200.2 L335.0 196.3 L338.5 192.7 L342.0 189.4 L345.5 186.4 L349.0 183.7 L352.5 181.2 L356.0 178.9 L359.5 176.8 L363.0 174.8 L366.5 173.1 L370.0 171.5 L373.5 170.1 L377.0 168.9 L380.5 167.7 L384.0 166.7 L387.5 165.8 L391.0 165.0 L394.5 164.4 L398.0 163.8 L401.5 163.3 L405.0 162.9 L408.5 162.6 L412.0 162.4 L415.5 162.3 L419.0 162.2 L422.5 162.2 L426.0 162.3 L429.5 162.5 L433.0 162.7 L436.5 162.9 L440.0 163.3 L443.5 163.7 L447.0 164.1 L450.5 164.6 L454.0 165.1 L457.5 165.7 L461.0 166.3 L464.5 167.0 L468.0 167.7 L471.5 168.4 L475.0 169.2 L478.5 170.1 L482.0 170.9 L485.5 171.8 L489.0 172.8 L492.5 173.8 L496.0 174.8 L499.5 175.8 L503.0 176.9 L506.5 178.0 L510.0 179.1" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
