<text x="385.6" y="464.90909090909093" text-anchor="start" font-size="12" font-weight="700" fill="#dc2626">P1 (x1, y1)</text>
<text x="213.4" y="75.09090909090912" text-anchor="start" font-size="12" font-weight="700" fill="#dc2626">P2 (x2, y2)</text>
<text x="84" y="376.90909090909093" text-anchor="end" font-size="11" font-weight="700" fill="#1f2937">P0</text>
<text x="516" y="173.09090909090907" text-anchor="start" font-size="11" font-weight="700" fill="#1f2937">P3</text>
<text x="86" y="183.09090909090907" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">1</text>
<text x="86" y="364.90909090909093" text-anchor="end" font-size="11" font-weight="400" fill="#64748b">0</text>
<text x="560" y="100" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">cubic-bezier(0.68, -0.55, 0.27, 1.55)</text>
<rect x="560" y="140" width="120" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="620.0" y="161.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">x1 y x2</text>
<text x="692" y="162" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">entre 0 y 1 (el tiempo no retrocede)</text>
<rect x="560" y="184" width="120" height="34" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="620.0" y="205.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">y1 e y2</text>
<text x="692" y="206" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">pueden salirse de 0 a 1</text>
<rect x="560" y="228" width="120" height="34" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="620.0" y="249.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">P0 y P3</text>
<text x="692" y="250" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">fijos: (0, 0) y (1, 1)</text>
<rect x="560" y="272" width="120" height="34" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="620.0" y="293.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">x fuera de 0 a 1</text>
<text x="692" y="294" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">se ignora toda la declaración</text>
<text x="560" y="340" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Medido (caja que recorre 200px en 2s):</text>
<text x="560" y="368" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">  25% del tiempo → -16.6px</text>
<text x="560" y="392" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">  50% del tiempo → 119.3px</text>
<text x="560" y="416" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">  75% del tiempo → 217.8px</text>
<text x="560" y="440" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve"> 100% del tiempo → 200px</text>
<text x="560" y="478" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">A los 75% la caja pasó los 200px de su destino y vuelve.</text>
</svg>
