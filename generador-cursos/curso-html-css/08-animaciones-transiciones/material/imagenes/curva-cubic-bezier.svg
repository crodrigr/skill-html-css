<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La curva cubic-bezier y sus puntos de control</title>
<desc id="d">Una curva cubic-bezier(0.68, -0.55, 0.27, 1.55) dibujada sobre un eje de tiempo de 0 a 1 y de progreso de menos 0.6 a 1.6. Los dos puntos de control, P1 con x 0.68 e y menos 0.55 y P2 con x 0.27 e y 1.55, tiran de la curva desde los extremos. La curva baja por debajo de 0 al principio y se pasa de 1 antes de asentarse.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">cubic-bezier(x1, y1, x2, y2): dos puntos de control</text>
<rect x="90" y="70" width="420" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="195.0" y1="70" x2="195.0" y2="470" stroke="#e2e8f0" stroke-width="1"/>
<line x1="300.0" y1="70" x2="300.0" y2="470" stroke="#e2e8f0" stroke-width="1"/>
<line x1="405.0" y1="70" x2="405.0" y2="470" stroke="#e2e8f0" stroke-width="1"/>
