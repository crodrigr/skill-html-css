<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Estructura de una tabla</title>
<desc id="d">Una tabla tiene un caption arriba, un thead con los encabezados th, un tbody con las filas de datos td y un tfoot con una celda que ocupa tres columnas con colspan.</desc>
