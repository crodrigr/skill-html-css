<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomía de un formulario</title>
<desc id="d">Un form con method get contiene campos input con type, name y value y etiquetas label; al enviarlo, los nombres y valores aparecen en la dirección de la página.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="998" height="428" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="500" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Anatomía de un formulario</text>
<rect x="40" y="60" width="540" height="260" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="86" text-anchor="start" font-size="14" font-weight="700" fill="#64748b">&lt;form method="get"&gt;</text>
<rect x="70" y="100" width="230" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="185.0" y="126.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;label for="nombre"&gt; Nombre</text>
<rect x="320" y="100" width="240" height="44" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="440.0" y="126.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;input type="text" name="nombre"&gt;</text>
<rect x="70" y="160" width="230" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="185.0" y="186.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;label for="paginas"&gt; Páginas</text>
<rect x="320" y="160" width="240" height="44" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="440.0" y="186.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;input type="number" value="3"&gt;</text>
<rect x="70" y="220" width="490" height="44" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="315.0" y="246.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;input type="radio" name="tipo" value="blog"&gt; Blog</text>
<rect x="70" y="274" width="490" height="36" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="315.0" y="296.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">&lt;input type="submit" value="Enviar"&gt;</text>
<text x="610" y="114" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">label: el texto que ve la persona</text>
<line x1="562" y1="106" x2="604" y2="110" stroke="#64748b" stroke-width="2"/>
<text x="610" y="174" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">type: cambia el comportamiento</text>
<line x1="562" y1="166" x2="604" y2="170" stroke="#64748b" stroke-width="2"/>
<text x="610" y="240" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">name + value: lo que se envía</text>
<line x1="562" y1="232" x2="604" y2="236" stroke="#64748b" stroke-width="2"/>
<text x="610" y="288" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">value del botón: su texto</text>
<line x1="562" y1="280" x2="604" y2="284" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="350" width="920" height="50" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="500.0" y="379.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Al enviar (sin servidor): la página se recarga con  ?nombre=Ana&amp;paginas=3&amp;tipo=blog</text>
<path d="M310 322 V346" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
