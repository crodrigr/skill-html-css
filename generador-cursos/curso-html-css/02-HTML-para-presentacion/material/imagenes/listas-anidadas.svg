<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Listas anidadas</title>
<desc id="d">Una lista no enumerada ul contiene elementos li; la sublista de paneles y consultorios va dentro del primer li, no directamente dentro del ul exterior.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Una sublista va dentro de un &lt;li&gt;</text>
<rect x="40" y="60" width="820" height="320" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="70" y="92" text-anchor="start" font-size="15" font-weight="700" fill="#64748b">&lt;ul&gt;</text>
<rect x="70" y="106" width="760" height="160" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="100" y="134" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">&lt;li&gt; Sitios para negocios</text>
<rect x="100" y="148" width="700" height="100" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="130" y="174" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">&lt;ul&gt;  (sublista, dentro del &lt;li&gt;)</text>
<rect x="130" y="188" width="300" height="44" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="280.0" y="214.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">&lt;li&gt; Panaderías</text>
<rect x="450" y="188" width="300" height="44" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="600.0" y="214.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">&lt;li&gt; Consultorios</text>
<rect x="70" y="282" width="370" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="255.0" y="308.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">&lt;li&gt; Sitios personales</text>
<rect x="460" y="282" width="370" height="44" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="645.0" y="308.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">&lt;li&gt; Blogs</text>
<text x="450" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Los hijos directos de &lt;ul&gt; y &lt;ol&gt; son siempre &lt;li&gt;.</text>
</svg>
