<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Metodología BEM: bloque, elemento y modificador</title>
<desc id="d">El bloque tarjeta contiene los elementos tarjeta__imagen, tarjeta__titulo, tarjeta__texto y tarjeta__enlace; los modificadores tarjeta--destacada, del bloque, y tarjeta__titulo--grande, del elemento titulo, cambian su aspecto.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="438" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">BEM: bloque, elemento y modificador</text>
<rect x="30" y="56" width="560" height="360" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="84" text-anchor="start" font-size="15" font-weight="700" fill="#2563eb">Bloque: tarjeta</text>
<rect x="630" y="56" width="300" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="780.0" y="77.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Bloque</text>
<text x="780.0" y="94.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">un componente que vive solo: tarjeta</text>
<rect x="60" y="100" width="500" height="50" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="76" y="122" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">tarjeta__imagen</text>
<text x="76" y="140" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">la imagen</text>
<rect x="60" y="162" width="500" height="50" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="76" y="184" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">tarjeta__titulo</text>
<text x="76" y="202" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">el título</text>
<rect x="60" y="224" width="500" height="50" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="76" y="246" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">tarjeta__texto</text>
<text x="76" y="264" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">el texto</text>
<rect x="60" y="286" width="500" height="50" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="76" y="308" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">tarjeta__enlace</text>
<text x="76" y="326" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">el enlace</text>
<rect x="630" y="116" width="300" height="52" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="780.0" y="137.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Elemento</text>
<text x="780.0" y="154.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">una parte del bloque: bloque__elemento</text>
<rect x="630" y="190" width="300" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="780.0" y="215.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Modificador</text>
<text x="780.0" y="232.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">una variante de aspecto o estado</text>
<text x="780.0" y="249.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">bloque--modif · bloque__elem--modif</text>
<rect x="630" y="290" width="300" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="646" y="314" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">tarjeta--destacada</text>
<text x="646" y="334" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">modifica al bloque</text>
<rect x="630" y="358" width="300" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="646" y="382" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">tarjeta__titulo--grande</text>
<text x="646" y="402" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">modifica a un elemento</text>
</svg>
