<text x="44" y="142" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">a[href]</text>
<text x="44" y="159" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">tiene el atributo</text>
