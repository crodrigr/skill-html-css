<title id="t">Posiciones entre hermanos</title>
<desc id="d">Cinco elementos li numerados del 1 al 5: li:first-child elige el 1, li:last-child el 5, li:nth-child(3) el 3, li:nth-child(even) el 2 y el 4, y li:nth-child(odd) el 1, el 3 y el 5; li:only-child solo elige un li sin hermanos.</desc>
