<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maquetas con Grid | Mateo Ruiz</title>
    <link rel="stylesheet" href="css/basico-01.css">
  </head>
  <body>
    <header>
      <h1>Maquetas con Grid</h1>
      <nav>
        <a href="basico-01.html">Inicio</a> |
        <a href="galeria.html">Galería</a>
      </nav>
    </header>

    <main>
      <h2>Galería</h2>
      <section class="galeria">
        <div class="caja">Foto 1</div>
        <div class="caja">Foto 2</div>
        <div class="caja">Foto 3</div>
        <div class="caja">Foto 4</div>
        <div class="caja">Foto 5</div>
        <div class="caja">Foto 6</div>
      </section>

      <h2>Maqueta</h2>
      <section class="maqueta">
        <div class="caja">Menú</div>
        <div class="caja">Texto</div>
        <div class="caja">Nota</div>
      </section>

      <h2>Proporción</h2>
      <section class="proporcion">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
      </section>
    </main>
  </body>
</html>
