<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La misma cuadrícula en tres tamaños</title>
<desc id="d">La misma página en tres ventanas. A 500 píxeles todos los bloques se apilan en una columna. A 800 píxeles hay dos columnas: el menú y el contenido van juntos y la cabecera, el lateral y el pie ocupan el ancho. A 1200 píxeles hay tres columnas: menú, contenido y lateral en la misma fila, entre la cabecera y el pie.</desc>
