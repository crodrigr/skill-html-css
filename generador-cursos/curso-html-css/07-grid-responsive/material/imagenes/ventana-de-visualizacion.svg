<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La ventana de visualización</title>
<desc id="d">Dos teléfonos. Sin la etiqueta meta viewport, según MDN el navegador móvil dibuja la página en una ventana virtual de unos 980 píxeles y la reduce para que quepa, y el texto queda diminuto. Con la etiqueta, la página se dibuja en el ancho real del dispositivo y el texto se lee bien.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="538" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La ventana de visualización (viewport)</text>
<text x="250" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Sin la etiqueta</text>
<rect x="60" y="100" width="220" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
<text x="170" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Ventana virtual</text>
<text x="170" y="152" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">≈ 980px (según MDN)</text>
<text x="170" y="170" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">la página se dibuja aquí…</text>
<path d="M170 194 L170 224" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="240" y="214" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">y se reduce</text>
<rect x="105" y="228" width="130" height="250" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<rect x="115" y="250" width="110" height="206" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="118" y="258" width="104" height="5" rx="2" fill="#2563eb"/>
<rect x="118" y="270" width="104" height="3" rx="1.5" fill="#cbd5e1"/>
<rect x="118" y="277" width="80" height="3" rx="1.5" fill="#cbd5e1"/>
<rect x="118" y="284" width="104" height="3" rx="1.5" fill="#cbd5e1"/>
<rect x="118" y="291" width="80" height="3" rx="1.5" fill="#cbd5e1"/>
<rect x="118" y="300" width="104" height="20" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
<text x="170" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937"></text>
<text x="710" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Con la etiqueta</text>
<rect x="620" y="100" width="170" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="705" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Ventana real</text>
<text x="705" y="152" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">ancho del dispositivo</text>
<text x="705" y="170" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">width=device-width</text>
<path d="M705 194 L705 224" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="640" y="228" width="130" height="250" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<rect x="650" y="250" width="110" height="206" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="656" y="258" width="98" height="16" rx="3" fill="#2563eb"/>
<rect x="656" y="286" width="98" height="9" rx="3" fill="#cbd5e1"/>
<rect x="656" y="304" width="80" height="9" rx="3" fill="#cbd5e1"/>
<rect x="656" y="322" width="98" height="9" rx="3" fill="#cbd5e1"/>
<rect x="656" y="340" width="80" height="9" rx="3" fill="#cbd5e1"/>
<rect x="656" y="358" width="98" height="9" rx="3" fill="#cbd5e1"/>
<rect x="656" y="386" width="98" height="52" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="300" y="360" text-anchor="start" font-size="14" font-weight="700" fill="#dc2626">texto diminuto</text>
<text x="300" y="380" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">las consultas de 600px o 480px</text>
<text x="300" y="396" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">nunca se activan</text>
<text x="790" y="360" text-anchor="start" font-size="14" font-weight="700" fill="#16a34a">texto legible</text>
<text x="790" y="380" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">las consultas de medios</text>
<text x="790" y="396" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">responden como se espera</text>
<text x="480" y="512" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</text>
</svg>
