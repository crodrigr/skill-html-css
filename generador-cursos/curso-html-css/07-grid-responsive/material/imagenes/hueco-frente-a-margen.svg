<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Hueco frente a margen</title>
<desc id="d">A la izquierda, tres cajas con gap: los huecos aparecen solo entre las cajas y no en los bordes exteriores. A la derecha, tres cajas con margin: cada caja tiene espacio a ambos lados, también en los bordes exteriores.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="428" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Hueco (gap) frente a margen (margin)</text>
<text x="240" y="82" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" fill="#1f2937" xml:space="preserve">gap: 16px</text>
<text x="240" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">en el contenedor</text>
<rect x="50" y="124" width="380" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="50" y="150" width="120" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="110" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1</text>
<rect x="180" y="150" width="120" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="240" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2</text>
<rect x="310" y="150" width="120" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="370" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3</text>
<rect x="170" y="150" width="10" height="58" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="300" y="150" width="10" height="58" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<text x="710" y="82" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" fill="#1f2937" xml:space="preserve">margin: 8px</text>
<text x="710" y="104" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">en cada elemento</text>
<rect x="520" y="124" width="380" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="528" y="148" width="108" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="582" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1</text>
<rect x="652" y="148" width="108" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="706" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2</text>
<rect x="776" y="148" width="108" height="58" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="830" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3</text>
<rect x="520" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="636" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="644" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="760" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="768" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="884" y="140" width="8" height="74" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<rect x="50" y="266" width="22" height="16" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
<text x="82" y="279" text-anchor="start" font-size="13" font-weight="400" fill="#1f2937">= espacio</text>
<text x="50" y="322" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Con gap: el espacio solo aparece ENTRE las pistas.</text>
<text x="50" y="346" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">No hay hueco antes de la primera ni después de la última.</text>
<text x="520" y="322" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Con margin: cada elemento lleva su espacio,</text>
<text x="520" y="346" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">también en el borde exterior del contenedor.</text>
<text x="480" y="396" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Medido con 3 columnas en 1200px: gap 16px → altura 136; margin 8px → altura 152.</text>
</svg>
