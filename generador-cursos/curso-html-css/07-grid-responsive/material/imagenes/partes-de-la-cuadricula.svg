<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Partes de una cuadrícula</title>
<desc id="d">Una cuadrícula de tres columnas y dos filas con sus partes señaladas: el contenedor que la encierra, los elementos, las líneas numeradas (cuatro de columnas y tres de filas), las pistas (una columna y una fila), una celda y un área formada por dos celdas.</desc>
