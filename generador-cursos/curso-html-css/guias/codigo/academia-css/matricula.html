<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Academia — Matrícula</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/tipografia.css">
  <link rel="stylesheet" href="css/cajas.css">
</head>
<body>
  <header class="cabecera">
    <img class="cabecera__logo" src="imagenes/logo.svg" alt="Logo de la Academia de programación" width="240" height="80">
    <h1>Matricular a un estudiante</h1>
    <nav class="menu">
      <a class="menu__enlace" href="index.html">Inicio</a>
      <a class="menu__enlace" href="estudiantes.html">Estudiantes</a>
      <a class="menu__enlace" href="cursos.html">Cursos</a>
      <a class="menu__enlace menu__enlace--actual" href="matricula.html">Matricular</a>
    </nav>
  </header>

  <main>
    <p>Usá <strong>solo datos inventados</strong>: el formulario no se envía a ningún servidor.</p>

    <form class="formulario" method="get">
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="Ana Pérez">
      </p>
      <p>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo">
      </p>
      <p>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad">
      </p>

      <p>Curso:</p>
      <p class="opciones">
        <input type="radio" id="java" name="curso" value="java">
        <label for="java">Java desde cero</label>
        <input type="radio" id="web" name="curso" value="web">
        <label for="web">HTML y CSS</label>
        <input type="radio" id="git" name="curso" value="git">
        <label for="git">Git</label>
      </p>

      <p>
        <input type="checkbox" id="acepta" name="acepta" value="si">
        <label for="acepta">Acepto el reglamento de la Academia</label>
      </p>

      <p><input class="boton" type="submit" value="Matricular"></p>
    </form>
  </main>

  <footer class="pie">
    <p>Datos inventados · <a href="#">Volver arriba</a></p>
  </footer>
</body>
</html>
