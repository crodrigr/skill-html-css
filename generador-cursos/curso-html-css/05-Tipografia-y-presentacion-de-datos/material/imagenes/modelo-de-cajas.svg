<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Modelo de cajas</title>
<desc id="d">Una caja con sus cuatro capas de afuera hacia adentro: margen, borde, relleno y contenido. A la derecha, el cálculo del ancho total de la caja A de 200 píxeles de ancho, 20 de relleno y 5 de borde: 250 con content-box y 200 con border-box.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="438" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Las cuatro capas de una caja</text>
<rect x="40" y="60" width="440" height="350" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
<text x="260" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">margen (fuera del borde, transparente)</text>
<rect x="80" y="100" width="360" height="270" fill="#f1f5f9" stroke="#1e3a8a" stroke-width="10"/>
<rect x="230" y="90" width="60" height="20" rx="10" fill="#1e3a8a"/>
<text x="260" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">borde</text>
<rect x="100" y="122" width="320" height="228" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="260" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">relleno (dentro del borde)</text>
<rect x="140" y="166" width="240" height="140" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="140" y="166" width="240" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="260.0" y="231.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">contenido</text>
<text x="260.0" y="250.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">texto, imágenes…</text>
<rect x="510" y="60" width="410" height="160" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="715.0" y="116.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">content-box (por defecto)</text>
<text x="715.0" y="135.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">width = solo el contenido</text>
<text x="715.0" y="154.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">200 + 20 + 20 + 5 + 5 = 250 px</text>
<text x="715.0" y="173.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">de borde a borde</text>
<rect x="510" y="240" width="410" height="170" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="715.0" y="301.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">border-box</text>
<text x="715.0" y="320.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">width = contenido + relleno + borde</text>
<text x="715.0" y="339.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">el ancho total es 200 px</text>
<text x="715.0" y="358.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">el contenido queda en 150 px</text>
<text x="715" y="428" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">El margen nunca se incluye en width ni en height. Dibujo sin escala.</text>
</svg>
