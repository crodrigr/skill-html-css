<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Esquinas redondeadas</title>
<desc id="d">Tres cuadros con border-radius: uno con 16px que redondea las cuatro esquinas; uno con 16px 0, que redondea la esquina de arriba a la izquierda y la de abajo a la derecha; y uno con cuatro valores, numerados 1 a 4 en el sentido de las agujas del reloj desde arriba a la izquierda.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cómo se reparten los valores de border-radius</text>
<rect x="30" y="60" width="290" height="310" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="175" y="90" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">border-radius: 16px</text>
<path d="M111,112 H239 A16,16 0 0 1 255,128 V226 A16,16 0 0 1 239,242 H111 A16,16 0 0 1 95,226 V128 A16,16 0 0 1 111,112 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="175" y="275" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">un valor: las cuatro esquinas</text>
<rect x="340" y="60" width="290" height="310" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="485" y="90" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1f2937" xml:space="preserve">border-radius: 16px 0</text>
<path d="M421,112 H565 A0,0 0 0 1 565,112 V226 A16,16 0 0 1 549,242 H405 A0,0 0 0 1 405,242 V128 A16,16 0 0 1 421,112 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="485" y="275" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">1.º: arriba izq. y abajo der.</text>
<text x="485" y="295" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">2.º: arriba der. y abajo izq.</text>
<text x="485" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el 0 deja la esquina recta</text>
<rect x="650" y="60" width="290" height="310" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="795" y="90" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">border-radius: 4px 12px 20px 28px</text>
<path d="M719,112 H863 A12,12 0 0 1 875,124 V222 A20,20 0 0 1 855,242 H743 A28,28 0 0 1 715,214 V116 A4,4 0 0 1 719,112 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<circle cx="737" cy="134" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="737" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1</text>
<circle cx="853" cy="134" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="853" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2</text>
<circle cx="853" cy="220" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="853" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3</text>
<circle cx="737" cy="220" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="737" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4</text>
<text x="795" y="275" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">de arriba a la izquierda, en sentido horario</text>
<text x="795" y="295" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">cuatro valores</text>
<text x="795" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">1 arriba izq. · 2 arriba der.</text>
<text x="795" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">3 abajo der. · 4 abajo izq.</text>
</svg>
