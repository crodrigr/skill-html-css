<text x="830" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">4 valores</text>
<text x="830" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#1f2937" xml:space="preserve">margin: 5px 10px 15px 20px</text>
<rect x="780" y="150" width="100" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
