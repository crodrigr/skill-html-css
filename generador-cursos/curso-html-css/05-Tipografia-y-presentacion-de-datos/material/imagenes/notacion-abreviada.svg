<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Notación abreviada de márgenes y rellenos</title>
<desc id="d">Cuatro cuadros que muestran qué lado recibe cada valor en margin o padding: un valor para los cuatro lados; dos valores, vertical y horizontal; tres valores, arriba, horizontal y abajo; cuatro valores, arriba, derecha, abajo e izquierda en el sentido de las agujas del reloj.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Uno a cuatro valores: qué lado recibe cada uno</text>
<rect x="24" y="56" width="220" height="340" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="134" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">1 valor</text>
<text x="134" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">margin: 10px</text>
<rect x="84" y="150" width="100" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="134" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">caja</text>
<text x="134" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="200" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="134" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="68" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="134" y="308" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">los cuatro lados</text>
<rect x="256" y="56" width="220" height="340" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="366" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">2 valores</text>
<text x="366" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">margin: 10px 20px</text>
<rect x="316" y="150" width="100" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="366" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">caja</text>
<text x="366" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="432" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">20</text>
<text x="366" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="300" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">20</text>
<text x="366" y="308" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">arriba y abajo | izq. y der.</text>
<text x="366" y="332" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el 1.º vertical, el 2.º horizontal</text>
<rect x="488" y="56" width="220" height="340" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="598" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">3 valores</text>
<text x="598" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1f2937" xml:space="preserve">margin: 5px 10px 15px</text>
<rect x="548" y="150" width="100" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="598" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">caja</text>
<text x="598" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">5</text>
<text x="664" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
