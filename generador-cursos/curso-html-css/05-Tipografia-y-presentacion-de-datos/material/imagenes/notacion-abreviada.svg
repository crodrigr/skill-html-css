<text x="830" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">5</text>
<text x="896" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="830" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">15</text>
<text x="764" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">20</text>
<text x="830" y="308" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">arriba, der., abajo, izq.</text>
<text x="830" y="332" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">en el sentido de las agujas del reloj</text>
<text x="480" y="410" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Vale igual para padding. Los márgenes verticales contiguos colapsan; los rellenos nunca.</text>
