<text x="532" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">10</text>
<text x="598" y="308" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">arriba | izq. y der. | abajo</text>
<text x="598" y="332" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">el 2.º va a izquierda y derecha</text>
