<title id="t">Densidad de píxeles</title>
<desc id="d">Una caja de 200 píxeles de CSS en dos pantallas: en una pantalla común cada píxel de CSS es un punto físico y la caja usa 200 puntos; en una pantalla de alta densidad con una relación de 2, cada píxel de CSS son 2 por 2 puntos físicos y la caja usa 400 puntos, pero ocupa el mismo tamaño aparente.</desc>
