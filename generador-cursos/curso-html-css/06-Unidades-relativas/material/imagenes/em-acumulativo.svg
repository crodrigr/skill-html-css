<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">El efecto acumulativo de em</title>
<desc id="d">Tres niveles anidados, cada uno con font-size de 1.25em: el primero mide 20 píxeles porque su padre mide 16; el segundo, 25 porque su padre mide 20; y el tercero, 31.25 porque su padre mide 25. A la derecha, los mismos niveles con 1.25rem miden 20 píxeles los tres.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">em se acumula; rem no</text>
<text x="240" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Con em</text>
<text x="720" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Con rem</text>
<rect x="40" y="84" width="400" height="270" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="54" y="106" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 1: 1.25em → 20px</text>
<rect x="80" y="120" width="320" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="94" y="142" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 2: 1.25em → 25px</text>
<rect x="120" y="156" width="240" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="134" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 3: 1.25em → 31.25px</text>
<text x="240" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">16 × 1.25 = 20 · 20 × 1.25 = 25 · 25 × 1.25 = 31.25</text>
<rect x="520" y="84" width="400" height="270" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="534" y="106" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 1: 1.25rem → 20px</text>
<rect x="560" y="120" width="320" height="200" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="574" y="142" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 2: 1.25rem → 20px</text>
<rect x="600" y="156" width="240" height="130" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="614" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">Nivel 3: 1.25rem → 20px</text>
<text x="720" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">siempre 16 × 1.25 = 20: la referencia es la raíz</text>
</svg>
